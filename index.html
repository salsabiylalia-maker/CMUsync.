<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Link View</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#fefdfd;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:1400px;
      height:90vh;
      border:3px solid #0c285e;
      display:flex;
      overflow:hidden;
      background:#000;
    }

    /* Sidebar kiri */
    .sidebar{
      width:230px;
      border-right:2px solid #0c285e;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:30px;
      padding:30px 10px;
      background:#8a091c;
    }

    .menu-btn{
      width:120px;
      height:120px;
      border:3px solid #0c285;
      background:transparent;
      color:white;
      font-size:24px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .menu-btn:hover{
      background:white;
      color:black;
      transform:scale(1.05);
    }

    /* Area kanan */
    .content{
      flex:1;
      background:#0c285;
      position:relative;
      overflow:hidden;
    }

    /* Foto awal */
    .default-view{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* iframe link */
    iframe{
      width:100%;
      height:100%;
      border:none;
      display:none;
      background:white;
    }

    /* Input foto */
    .upload-box{
      position:absolute;
      top:20px;
      right:20px;
      z-index:10;
      background:rgba(0,0,0,0.7);
      padding:10px;
      border-radius:10px;
      color:white;
    }

    .upload-box input{
      color:white;
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- Sidebar -->
    <div class="sidebar">

      <a href="https://autode.sk/4twNkBt" target="_blank">
    <button class="menu-btn">Struktur</button>
    </a>

      <a href="https://autode.sk/48XH4eG" target="_blank">
    <button class="menu-btn">Rencana Mei</button>
    </a>

      <a href="https://autode.sk/4d76h94" target="_blank">
    <button class="menu-btn">Realisasi</button>
    </a>

      <a href="https://logwork.com/countdown-b4fk" target="_blank">
    <button class="menu-btn">Sisa Waktu</button>
    </a>

    </div>

    <!-- Content kanan -->
    <div class="content">


      <!-- Foto default -->
      <img 
        id="defaultImage"
        class="default-view"
        img src="COVER PROYEK.png"
      >

      <!-- iframe -->
      <iframe id="contentFrame"></iframe>

    </div>

  </div>

  <script>

    const iframe = document.getElementById("contentFrame");
    const defaultImage = document.getElementById("defaultImage");

    // Saat tombol sidebar diklik
    function openLink(link){

      defaultImage.style.display = "none";

      iframe.style.display = "block";

      iframe.src = link;
    }

    // Upload foto dari perangkat
    document.getElementById("uploadImage").addEventListener("change", function(event){

      const file = event.target.files[0];

      if(file){

        const reader = new FileReader();

        reader.onload = function(e){

          defaultImage.src = e.target.result;

        }

        reader.readAsDataURL(file);
      }

    });

  </script>

</body>
</html>
